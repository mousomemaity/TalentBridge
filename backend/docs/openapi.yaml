      parameters: []
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/RegisterCandidateDto"
      responses: 
        201: 
          description: Candidate registered successfully
        409: 
          description: Email already exists
      tags: 
        - Auth
  /api/v1/auth/register/employer: 
    post: 
      operationId: AuthController_registerEmployer
