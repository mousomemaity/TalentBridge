info: 
  title: TalentBridge Core API
  description: "Official TalentBridge API Contract for Job Portal & Applicant Tracking System (ATS). Integrates Candidate Portal, Employer ATS, Shared Database, and AI Adapter."
  version: 1.0.0
  contact: {}
tags: 
  - name: Auth
    description: "Candidate & Employer authentication, sessions, refresh rotation"
  - name: "Companies & Team"
    description: "Company account profiles, team members, invitations"
  - name: Candidate Portal
    description: "Candidate self-owned profiles, skills, education, preferences"
  - name: Resumes
    description: "Resume registration, AI parsing, profile merging"
  - name: "Files & Uploads"
    description: Presigned upload URLs
  - name: Jobs
    description: "Public job board search, employer ATS requisitions, pipeline publication"
  - name: Applications
    description: "Job applications, Kanban stages, optimistic locking, activity history"
  - name: "Pipelines & Stages"
    description: "Pipeline templates, customizable job stages, reordering"
  - name: "Saved Jobs & Alerts"
    description: "Candidate saved job bookmarks, search alerts"
  - name: "AI & Matching"
    description: "AI matching explainability, recommendations, JD generator, bias checker"
  - name: "Interviews & Assessments"
    description: "Interview scheduling, scorecards, timed assessments"
  - name: Notifications
    description: Candidate and employer real-time alerts and preferences
  - name: "Reports & Audit"
    description: "Hiring funnel metrics, sourcing analytics, time-to-hire, audit trail"
servers: []
components: 
  securitySchemes: 
    bearer: 
      scheme: bearer
      bearerFormat: JWT
      type: http
      name: Authorization
      description: "Enter your JWT access token (Bearer <token>)"
      in: header
  schemas: 
    RegisterCandidateDto: 
      type: object
      properties: 
        email: 
          type: string
          example: "candidate@example.com"
          description: Candidate email address
        password: 
          type: string
          example: "SecureP@ss123"
          description: Password (min 8 characters)
        firstName: 
          type: string
          example: Alex
          description: First name
        lastName: 
          type: string
          example: Morgan
          description: Last name
        phone: 
          type: string
          example: +1-555-0192
          description: Phone number
      required: 
        - email
        - password
        - firstName
        - lastName
    RegisterEmployerDto: 
      type: object
      properties: 
        email: 
          type: string
          example: "employer@acme.inc"
          description: Employer work email
        password: 
          type: string
          example: "SecureEmpP@ss123"
          description: Password (min 8 characters)
        firstName: 
          type: string
          example: Sarah
          description: First name
        lastName: 
          type: string
          example: Connor
          description: Last name
        companyName: 
          type: string
          example: Acme Corp
          description: Company name
        companySlug: 
          type: string
          example: acme-corp
          description: Optional unique URL slug for company
        domain: 
          type: string
          example: acme.inc
          description: Company primary domain
      required: 
        - email
        - password
        - firstName
        - lastName
        - companyName
    LoginDto: 
      type: object
      properties: 
        email: 
          type: string
          example: "user@example.com"
        password: 
          type: string
          example: "SecureP@ss123"
      required: 
        - email
        - password
    RefreshTokenDto: 
      type: object
      properties: 
        refreshToken: 
          type: string
          example: eyJhbGciOi...
          description: Refresh token string (can also be passed via HttpOnly cookie)
      required: 
        - refreshToken
    ForgotPasswordDto: 
      type: object
      properties: 
        email: 
          type: string
          example: "user@example.com"
      required: 
        - email
    ResetPasswordDto: 
      type: object
      properties: 
        token: 
          type: string
          example: reset-token-xyz
        newPassword: 
          type: string
          example: "NewSecureP@ss123"
      required: 
        - token
        - newPassword
    VerifyEmailDto: 
      type: object
      properties: 
        token: 
          type: string
          example: verification-token-xyz
      required: 
        - token
    CreateJobDto: 
      type: object
      properties: 
        title: 
          type: string
          example: Senior Backend Engineer
        slug: 
          type: string
          example: senior-backend-engineer
        department: 
          type: string
          example: Engineering
        location: 
          type: string
          example: Remote - US
        jobType: 
          type: string
          example: FULL_TIME
          enum: 
            - FULL_TIME
            - PART_TIME
            - CONTRACT
            - INTERNSHIP
        workplaceType: 
          type: string
          example: REMOTE
          enum: 
            - ONSITE
            - REMOTE
            - HYBRID
        salaryMin: 
          type: number
          example: 140000
        salaryMax: 
          type: number
          example: 180000
        currency: 
          type: string
          example: USD
        description: 
          type: string
          example: We are seeking an experienced Backend Engineer to scale our core platforms.
        requirements: 
          example: 
            - 5+ years Node.js/TypeScript
            - Microservices design
            - MongoDB/Postgres experience
          type: array
          items: 
            type: string
        skills: 
          example: 
            - TypeScript
            - NestJS
            - MongoDB
            - Docker
            - Redis
          type: array
          items: 
            type: string
        benefits: 
          example: 
            - "Health, Dental, Vision"
            - 401k match
            - Unlimited PTO
          type: array
          items: 
            type: string
        openings: 
          type: number
          example: 2
        screeningQuestions: 
          example: 
            - question: "How many years of TypeScript experience do you have?"
              type: NUMBER
              required: true
              isKnockout: false
          type: array
          items: 
            type: string
      required: 
        - title
        - jobType
        - workplaceType
        - description
    UpdateJobDto: 
      type: object
      properties: 
        title: 
          type: string
          example: Staff Backend Engineer
        department: 
          type: string
          example: Platform Engineering
        location: 
          type: string
          example: "New York, NY"
        jobType: 
          type: string
          enum: 
            - FULL_TIME
            - PART_TIME
            - CONTRACT
            - INTERNSHIP
        workplaceType: 
          type: string
          enum: 
            - ONSITE
            - REMOTE
            - HYBRID
        salaryMin: 
          type: number
          example: 150000
        salaryMax: 
          type: number
          example: 190000
        description: 
          type: string
        requirements: 
          type: array
          items: 
            type: string
        skills: 
          type: array
          items: 
            type: string
        benefits: 
          type: array
          items: 
            type: string
        openings: 
          type: number
        screeningQuestions: 
          type: array
          items: 
            type: string
    UpdateProfileDto: 
      type: object
      properties: 
        headline: 
          type: string
          example: Senior Full Stack Engineer
        summary: 
          type: string
          example: Passionate developer with 6+ years of building web and mobile apps.
        location: 
          type: string
          example: "San Francisco, CA"
        yearsExperience: 
          type: number
          example: 6
    AddExperienceDto: 
      type: object
      properties: 
        title: 
          type: string
          example: Software Engineer
        company: 
          type: string
          example: Tech Corp
        location: 
          type: string
          example: "New York, NY"
        startDate: 
          type: string
          example: 2022-01-01
        endDate: 
          type: string
          example: 2024-03-01
        current: 
          type: boolean
          example: false
        description: 
          type: string
          example: Led core platform microservices migration.
      required: 
        - title
        - company
        - startDate
    AddEducationDto: 
      type: object
      properties: 
        institution: 
          type: string
          example: "University of California, Berkeley"
        degree: 
          type: string
          example: Bachelor of Science
        fieldOfStudy: 
          type: string
          example: Computer Science
        startDate: 
          type: string
          example: 2018-08-01
        endDate: 
          type: string
          example: 2022-05-01
      required: 
        - institution
        - degree
        - startDate
    UpdateSkillsDto: 
      type: object
      properties: 
        skills: 
          example: 
            - name: TypeScript
              level: EXPERT
              yearsExperience: 5
            - name: React
              level: ADVANCED
              yearsExperience: 4
            - name: NestJS
              level: ADVANCED
              yearsExperience: 3
          type: array
          items: 
            type: string
      required: 
        - skills
    UpdatePreferencesDto: 
      type: object
      properties: 
        roles: 
          example: 
            - Backend Engineer
            - Full Stack Engineer
          type: array
          items: 
            type: string
        locations: 
          example: 
            - Remote
            - New York
            - San Francisco
          type: array
          items: 
            type: string
        salaryMin: 
          type: number
          example: 120000
        remoteOnly: 
          type: boolean
          example: true
        noticePeriodDays: 
          type: number
          example: 30
    UpdateVisibilityDto: 
      type: object
      properties: 
        visibility: 
          type: string
          example: PUBLIC
          enum: 
            - PUBLIC
            - RECRUITERS_ONLY
            - HIDDEN
        openToWork: 
          type: boolean
          example: true
        blockedCompanyIds: 
          example: []
          type: array
          items: 
            type: string
      required: 
        - visibility
    ApplyJobDto: 
      type: object
      properties: 
        resumeId: 
          type: string
          example: resume-uuid-1234
        coverLetter: 
          type: string
          example: I am excited to apply for this role because of my deep background in distributed systems...
        screeningAnswers: 
          type: object
          example: 
            experienceYears: 5
            authorizedToWork: true
    MoveStageDto: 
      type: object
      properties: 
        stageId: 
          type: string
          example: stage-uuid-5678
          description: Target stage ID
        version: 
          type: number
          example: 1
          description: Current version for optimistic locking
        reason: 
          type: string
          example: Advanced after technical screening interview
      required: 
        - stageId
        - version
    RejectApplicationDto: 
      type: object
      properties: 
        reason: 
          type: string
          example: Position filled by another candidate
      required: 
        - reason
    BulkMoveDto: 
      type: object
      properties: 
        applicationIds: 
          example: 
            - app-id-1
            - app-id-2
          type: array
          items: 
            type: string
        stageId: 
          type: string
          example: stage-uuid-5678
      required: 
        - applicationIds
        - stageId
    BulkRejectDto: 
      type: object
      properties: 
        applicationIds: 
          example: 
            - app-id-1
            - app-id-2
          type: array
          items: 
            type: string
        reason: 
          type: string
          example: Role requirements updated
      required: 
        - applicationIds
        - reason
    UpdateTenantDto: 
      type: object
      properties: 
        name: 
          type: string
          example: Acme Technologies Inc.
        logoUrl: 
          type: string
          example: "https://cdn.example.com/logo.png"
        domain: 
          type: string
          example: acme.com
        settings: 
          type: object
          example: 
            bio: Innovating HRTech
            primaryColor: "#2563eb"
    InviteMemberDto: 
      type: object
      properties: 
        email: 
          type: string
          example: "colleague@acme.com"
        role: 
          type: string
          example: RECRUITER
          enum: 
            - RECRUITER
            - HIRING_MANAGER
            - COMPANY_ADMIN
        department: 
          type: string
          example: Engineering
        firstName: 
          type: string
          example: Jane
        lastName: 
          type: string
          example: Doe
      required: 
        - email
        - role
    UpdateMemberDto: 
      type: object
      properties: 
        role: 
          type: string
          example: HIRING_MANAGER
          enum: 
            - RECRUITER
            - HIRING_MANAGER
            - COMPANY_ADMIN
        department: 
          type: string
          example: Design
        isActive: 
          type: boolean
          example: true
    CreateResumeDto: 
      type: object
      properties: 
        fileId: 
          type: string
          example: file-uuid-1234
        fileName: 
          type: string
          example: alex_morgan_resume.pdf
        fileUrl: 
          type: string
          example: "https://storage.talentbridge.io/resumes/file-uuid-1234.pdf"
        mimeType: 
          type: string
          example: application/pdf
        sizeBytes: 
          type: number
          example: 245000
      required: 
        - fileId
        - fileName
        - fileUrl
    PresignFileDto: 
      type: object
      properties: 
        fileName: 
          type: string
          example: resume.pdf
        mimeType: 
          type: string
          example: application/pdf
        category: 
          type: string
          example: RESUME
          enum: 
            - RESUME
            - AVATAR
            - DOCUMENT
            - LOGO
      required: 
        - fileName
        - mimeType
        - category
    CreateSavedSearchDto: 
      type: object
      properties: 
        name: 
          type: string
          example: Remote React Jobs
        query: 
          type: string
          example: React TypeScript
        filters: 
          type: object
          example: 
            workplaceType: REMOTE
            jobType: FULL_TIME
        frequency: 
          type: string
          example: DAILY
          enum: 
            - DAILY
            - WEEKLY
      required: 
        - name
    CreatePipelineTemplateDto: 
      type: object
      properties: 
        name: 
          type: string
          example: Engineering Technical Pipeline
        stages: 
          example: 
            - name: Applied
              kind: APPLIED
              position: 0
              slaDays: 3
            - name: Technical Assessment
              kind: SCREEN
              position: 1
              slaDays: 3
            - name: System Design Interview
              kind: INTERVIEW
              position: 2
              slaDays: 5
            - name: Executive Offer
              kind: OFFER
              position: 3
