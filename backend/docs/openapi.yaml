  /api/v1/jobs: 
    get: 
      operationId: JobsController_searchJobs
      summary: Search and filter published jobs (Public)
      parameters: 
        - name: q
          required: false
          in: query
          description: "Search keywords (title, skills, description)"
          schema: 
            type: string
        - name: location
          required: false
          in: query
          description: Location filter
          schema: 
            type: string
        - name: workplaceType
          required: false
          in: query
          schema: 
            enum: 
              - ONSITE
              - REMOTE
              - HYBRID
            type: string
        - name: jobType
          required: false
          in: query
          schema: 
            enum: 
              - FULL_TIME
              - PART_TIME
              - CONTRACT
              - INTERNSHIP
            type: string
        - name: department
          required: false
          in: query
          description: Department filter
          schema: 
            type: string
        - name: page
          required: false
          in: query
          schema: 
            example: 1
            type: string
        - name: limit
          required: false
          in: query
          schema: 
            example: 20
            type: string
      responses: 
        200: 
          description: 
      tags: 
        - Jobs
