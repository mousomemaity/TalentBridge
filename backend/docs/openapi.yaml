        required: true
        content: 
          application/json: 
            schema: 
              $ref: "#/components/schemas/RefreshTokenDto"
      responses: 
        200: 
          description: Tokens rotated successfully
        401: 
          description: Invalid or revoked refresh token
      tags: 
        - Auth
  /api/v1/auth/logout: 
    post: 
      operationId: AuthController_logout
      summary: Logout and revoke current session
